name: Daily check-in

on:
  schedule:
    - cron: "17 12 * * *" # Daily at 5:47 PM India time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-check-in
  cancel-in-progress: false

jobs:
  check-in:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Update daily check-in
        env:
          TZ: Asia/Kolkata
        run: |
          git config user.name "alisha"
          git config user.email "alishaofficial.xvi@gmail.com"

          count=$(( RANDOM % 5 + 1 ))
          echo "Creating $count automated commits"

          for i in $(seq 1 "$count"); do
            timestamp=$(date '+%F %H:%M:%S')
            printf 'Automated check-in: %s | %s/%s\n' \
              "$timestamp" "$i" "$count" > check-in.txt

            git add check-in.txt
            git commit -m "Automated check-in $i/$count: $timestamp"
          done

          git push
