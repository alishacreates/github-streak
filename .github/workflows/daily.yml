name: Daily check-in

on:
  schedule:
    - cron: "17 12 * * *" # Daily at 5:47 PM India time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-check-in
  cancel-in-progress: false

jobs:
  check-in:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Update daily check-in
        env:
          TZ: Asia/Kolkata
        run: |
          git config user.name "YOUR_USERNAME"
          git config user.email "YOUR_GITHUB_NOREPLY_EMAIL"

          today=$(date +%F)
          printf 'Last automated check-in: %s\n' "$today" > check-in.txt

          git add check-in.txt
          if git diff --cached --quiet; then
            echo "Already checked in today."
            exit 0
          fi

          git commit -m "Automated daily check-in: $today"
          git push
